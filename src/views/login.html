<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mini Gestão</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
        <i class="bi bi-kanban fs-3"></i>
      </div>
      <h3 class="fw-bold mb-1">Mini Gestão</h3>
      <p class="text-muted small mb-0">Sistema Web de Gerenciamento de Clientes e Tarefas</p>
    </div>

    <div class="login-body">
      <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small">E-mail de acesso</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="admin@minigestao.local" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small">Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center text-muted small">
        <p class="mb-1"><strong>Acesso Padrão:</strong></p>
        <span class="badge bg-light text-dark border">admin@minigestao.local</span>
        <span class="badge bg-light text-dark border">admin123</span>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
