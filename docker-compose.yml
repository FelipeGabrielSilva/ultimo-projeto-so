services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-senha_segura_123}@database:5432/${POSTGRES_DB:-mini_gestao}}
      - SESSION_SECRET=${SESSION_SECRET:-chave_secreta_padrao_substitua_em_producao_928374}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-86400000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mini_gestao_net

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura_123}
      POSTGRES_DB: ${POSTGRES_DB:-mini_gestao}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || pg_isready -U app_user || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mini_gestao_net

volumes:
  pgdata:
    driver: local

networks:
  mini_gestao_net:
    driver: bridge
